<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲸鱼娘 OBS 控制台</title><link rel="stylesheet" href="./style.css"></head>
<body><main><header><h1>鲸鱼娘 OBS</h1><p>独立直播互动控制台 · 不依赖 DSH</p></header>
<section><h2>连接与模型</h2><form id="settings"><label>本地 blivechat 地址<input name="blivechatUrl" type="url" required></label><label>B 站直播间房间号（使用身份码时可留空）<input name="roomId" inputmode="numeric"></label><label>直播开放平台身份码（可选、仅本次连接使用）<input id="authCode" type="password" autocomplete="off" placeholder="填写后优先使用身份码"></label><label>模型 API Base URL<input name="baseUrl" type="url" required></label><label>模型名称<input name="model" required></label><label>API 密钥 <small id="secret"></small><input name="apiKey" type="password" autocomplete="off" placeholder="留空保留已保存的密钥"></label><label>角色提示词<textarea name="prompt" rows="3"></textarea></label><p class="notice">选中的弹幕会发送到你指定的模型服务商，可能产生费用；密钥使用系统安全存储。</p><div class="buttons"><button type="submit">保存设置</button><button type="button" id="connect">连接弹幕</button><button type="button" id="disconnect" class="secondary">停止连接</button></div></form></section>
<section><h2>调度设置</h2><p>弹幕量大时按用户公平性选择回复，超过队列上限或等待时间的弹幕会被跳过。</p><div class="buttons"><label>队列上限<input form="settings" name="queueSize" type="number" min="1" max="500" required></label><label>弹幕有效期（秒）<input form="settings" name="ttlSeconds" type="number" min="5" max="600" required></label><label>同用户冷却（秒）<input form="settings" name="cooldownSeconds" type="number" min="0" max="600" required></label><label>回复间隔（秒）<input form="settings" name="intervalSeconds" type="number" min="5" max="600" required></label></div></section>
<section><h2>OBS 浏览器源</h2><p>添加「浏览器」源并粘贴以下地址，设置合适的宽高。地址包含只读令牌，请勿公开。</p><div class="buttons"><input id="overlay" readonly aria-label="OBS 浏览器源地址"><button id="copy">复制地址</button></div></section>
<section><h2>手动表演</h2><div class="buttons"><select id="motion" aria-label="选择动作"><option value="idle">待机</option><option value="aidale">发呆</option><option value="selfie">自拍</option><option value="selfieQuick">快速自拍</option><option value="ketchup">番茄酱</option><option value="openLid">开盖</option><option value="bubble">吹泡泡</option><option value="splash">喷水</option></select><select id="expression" aria-label="选择表情"><option value="">保持当前表情</option><option value="__reset__">恢复默认表情</option></select><input id="text" maxlength="300" placeholder="可选气泡文字"><button id="perform">表演</button></div></section>
<section><h2>运行状态</h2><p id="status" role="status">正在启动…</p><p id="statistics"></p><p id="error" role="alert"></p></section><footer>当前角色仅限符合非商业授权的使用场景，详见随程序附带的许可说明。</footer></main><script src="./app.js"></script></body></html>
